name: Build PDF Page Swapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build portable EXE
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDF_Page_Swapper --icon=pdf_page_swapper.ico --add-data "pdf_page_swapper.ico;." pdf_page_swapper.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Package files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\PDF_Page_Swapper.exe package\
          Copy-Item Output\PDF_Page_Swapper_Setup.exe package\
          Copy-Item README_KH.txt package\
          Compress-Archive -Path package\* -DestinationPath PDF_Page_Swapper_Windows_Installer.zip -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Page_Swapper_Windows_Installer
          path: PDF_Page_Swapper_Windows_Installer.zip
          retention-days: 14
